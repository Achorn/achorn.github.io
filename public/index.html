<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121410" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Joshua Achorn — application developer, videogame developer, and artist. Three.js games, React apps, and the occasional drawing."
    />
    <link rel="canonical" href="https://joshuaachorn.com/" />

    <!--
      Link previews. These are static, so every route shares one card — the
      hash router means crawlers only ever see this file.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joshua Achorn" />
    <meta property="og:url" content="https://joshuaachorn.com/" />
    <meta property="og:title" content="Joshua Achorn — developer, game developer, artist" />
    <meta
      property="og:description"
      content="Three.js games, React apps, and the occasional drawing. Selected work, experience, and art."
    />
    <meta property="og:image" content="https://joshuaachorn.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joshua Achorn — application developer, game developer, artist" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joshua Achorn — developer, game developer, artist" />
    <meta
      name="twitter:description"
      content="Three.js games, React apps, and the occasional drawing. Selected work, experience, and art."
    />
    <meta name="twitter:image" content="https://joshuaachorn.com/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Joshua Achorn</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
